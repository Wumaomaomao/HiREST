openapi: 3.0.1
info:
  title: API for String Case Study (SCS)
  description: Examples of different string algorithms accessible via REST
  version: "1.0"
servers:
- url: http://localhost:50108/
tags:
- name: scs-rest
  description: Scs Rest
paths:
  /api/calc/{op}/{arg1}/{arg2}:
    get:
      tags:
      - scs-rest
      summary: calc
      operationId: calcUsingGET
      parameters:
      - name: arg1
        in: path
        description: arg1
        required: true
        schema:
          type: number
          format: double
        example: 0.123
      - name: arg2
        in: path
        description: arg2
        required: true
        schema:
          type: number
          format: double
        example: 0.123
      - name: op
        in: path
        description: op
        required: true
        schema:
          type: string
        example: abc
      responses:
        200:
          description: OK
          content:
            '*/*':
              schema:
                type: string
        401:
          description: Unauthorized
          content: {}
        403:
          description: Forbidden
          content: {}
        404:
          description: Not Found
          content: {}
      deprecated: false
          description: Not Found
          content: {}
      deprecated: false
components: {}
